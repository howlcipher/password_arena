name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[all]"
        python -m pip install build
    - name: Run Ruff
      run: ruff check .
    - name: Run mypy
      run: mypy src/password_arena
    - name: Run tests
      run: pytest
    - name: Build package
      run: python -m build
    - name: CLI smoke test
      run: password-arena --rounds 1 --max-guesses 10
    - name: Dashboard import smoke test
      run: python -c "import src.password_arena.dashboard"

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t password-arena .
